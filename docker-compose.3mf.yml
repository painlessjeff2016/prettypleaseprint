# Standalone AD5X conversion test service.
# Usage:
#   docker compose -f docker-compose.3mf.yml run --rm converter \
#     /work/input.3mf /work/result
# Place the converter engine (bambu2ad5x.py) at ./data/converter/engine/
# and its bundled ad5x_template.json beside it.
services:
  converter:
    build:
      context: .
      dockerfile: services/3mf-converter/Dockerfile
    network_mode: none
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 768m
    volumes:
      - ./data/converter/engine:/engine:ro
      - ./data/converter/work:/work
    tmpfs:
      - /tmp:size=512m,mode=1777
    entrypoint: ["python3", "/app/convert.py"]
    command: ["/work/input.3mf", "/work/result", "--engine", "/engine/bambu2ad5x.py"]
